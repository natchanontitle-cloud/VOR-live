// เหตุการณ์ตอบกลับของ JS / YS (เก็บใน step.ev) — ข้อมูลเดิมที่มีแค่ d2 แปลงเป็นเหตุการณ์ให้อัตโนมัติ
function stepEv(s){
  const ev=Array.isArray(s.ev)?s.ev.filter(e=>e&&e.d&&e.t):[];
  if(ev.length) return ev;
  if(s.kind==='js' && s.d2) return [{t:'reply',d:s.d2}];
  if(s.kind==='ys' && s.result==='rejected' && (s.d2||s.d1)) return [{t:'reject',d:s.d2||s.d1}];
  return [];
}
/* ซ่อมแล้วอาการไม่หาย: JS ที่เปิดหลังอะไหล่มาถึง / หลังประกอบ ในครั้งเดียวกัน = ครั้งใหม่ (ไหลลงไปเรื่อยๆ ไม่ย้อนขึ้น) */
function repairPoint(ss,r){ const ds=ss.filter(x=>(x.round||1)===r).flatMap(x=>x.kind==='parts'?[x.d3]:x.kind==='assemble'?[x.d1]:[]).filter(Boolean).sort(); return ds.length?ds[ds.length-1]:null; }
function fixRounds(ss,mk){ // mk(kind,round,obj) สร้างแถวใหม่
  for(let r=1;r<=Math.max(1,...ss.map(x=>x.round||1));r++){
    const rs=ss.filter(x=>(x.round||1)===r), tst=rs.find(x=>x.kind==='test');
    if(tst&&tst.result==='fail') continue;
    const X=repairPoint(ss,r); if(!X) continue;
    const js=rs.filter(x=>x.kind==='js'&&x.d1&&x.d1>X).sort((a,b)=>a.d1<b.d1?-1:1)[0]; if(!js) continue;
    const D=js.d1;
    ss.forEach(x=>{ if((x.round||1)>r) x.round=(x.round||1)+1; });
    rs.forEach(x=>{ if(['js','ys','parts'].includes(x.kind) && x.d1 && x.d1>=D) x.round=r+1; });
    if(tst){ tst.result='fail'; tst.d1=tst.d1&&tst.d1<=D?tst.d1:D; } else ss.push(mk('test',r,{d1:D,result:'fail'}));
  }
  return ss;
}
const ysFinal = s => s.result==='approved' || s.result==='nocover';
function timeline(c, steps){
  const T=today(), ev=[];
  const add=(d,k,r,s,x)=>{ if(d) ev.push({d,k,r,s,x,rd:s?(s.round||1):0}); };
  add(c.arrival_date,'arrival',0);
  add(c.analysis_date,'analysis',1);
  (steps||[]).forEach(s=>{ const R=(s.round||1)*10;
    if(s.kind==='diag') add(s.d1,'diag_done',R+0.5,s);
    if(s.kind==='js'){ add(s.d1,'js_req',R+1,s); stepEv(s).forEach((e,i)=>add(e.d, e.t==='send'?'js_send':'js_rep', R+1.1+i*0.001, s, e)); add(s.d3,'js_close',R+1.9,s); }
    if(s.kind==='ys'){ add(s.d1,'ys_req',R+2,s); stepEv(s).forEach((e,i)=>add(e.d, e.t==='resubmit'?'ys_resub':'ys_rej', R+2.1+i*0.001, s, e)); if(ysFinal(s)) add(s.d2||s.d1,'ys_fin',R+2.9,s); }
    if(s.kind==='parts'){ add(s.d1,'parts_order',R+3,s); add(s.d3,'parts_arr',R+3.1,s); }
    if(s.kind==='assemble') add(s.d1,'assemble',R+4,s);
    if(s.kind==='test' && s.result) add(s.d1, s.result==='fail'?'test_fail':s.result==='pass'?'test_pass':'test_ip', R+5,s);
  });
  add(c.customer_contact_date,'contact',900);
  add(c.cancelled_date,'cancel',901);
  add(c.delivered_date,'delivered',902);
  ev.sort((a,b)=> a.d===b.d ? a.r-b.r : (a.d<b.d?-1:1));

  const jsG=new Set(), jsP=new Set(), ysG=new Set(), ysP=new Set(), parts=new Set(), RI={};
  const ri=r=>RI[r]=RI[r]||{analysed:false,noparts:false,ordered:0,assembled:false,test:null};
  let round=1, ysFinAny=false, ended=null;
  const mk=(k,detail)=>({k, o:ST[k].o, detail:detail||''});
  const states=ev.map(e=>{
    const s=e.s;
    if(s && e.k!=='diag_done' && e.rd) { if(e.rd>round) round=e.rd; ri(e.rd).analysed=true; }
    if(s && e.k==='diag_done' && e.rd>round) round=e.rd;
    switch(e.k){
      case 'analysis': ri(1).analysed=true; break;
      case 'diag_done': ri(e.rd).analysed=true; ri(e.rd).noparts = s.result==='noparts'; break;
      case 'js_req': jsP.delete(s); jsG.add(s); break;
      case 'js_rep': jsG.delete(s); jsP.add(s); break;
      case 'js_send': jsP.delete(s); jsG.add(s); break;
      case 'js_close': jsG.delete(s); jsP.delete(s); break;
      case 'ys_req': ysP.delete(s); ysG.add(s); break;
      case 'ys_rej': ysG.delete(s); ysP.add(s); break;
      case 'ys_resub': ysP.delete(s); ysG.add(s); break;
      case 'ys_fin': ysG.delete(s); ysP.delete(s); ysFinAny=true; break;
      case 'parts_order': parts.add(s); ri(e.rd).ordered++; break;
      case 'parts_arr': parts.delete(s); break;
      case 'assemble': ri(e.rd).assembled=true; break;
      case 'test_pass': ri(e.rd).test='pass'; break;
      case 'test_fail': ri(e.rd).test='fail'; if(e.rd+1>round) round=e.rd+1; break;
      case 'test_ip': ri(e.rd).test='ip'; ri(e.rd).testNote = s.result==='other' ? (s.note||L('อื่นๆ','Other')) : L('ระหว่างทดสอบ / เก็บข้อมูล','Testing / collecting data')+(s.note?' · '+s.note:''); break;
      case 'cancel': ended='cancel'; break;
      case 'delivered': ended='done'; break;
    }
    if(ended) return mk(ended, ended==='cancel'?(c.cancel_reason?cancelName(c.cancel_reason):''):'');
    const cr=ri(round), rTag = round>1 ? L('ครั้งที่ ','Round ')+round : '';
    const ref=set=>{ const x=[...set][0]; const n=stepEv(x).filter(v=>v.t===(x.kind==='js'?'reply':'reject')).length; return (x.ref_no||'')+(n>1?' · '+L('ตอบรอบที่ ','reply #')+n:''); };
    if(jsG.size) return mk('js_wait',ref(jsG));
    if(jsP.size) return mk('js_close',ref(jsP));
    if(ysG.size) return mk('ys_wait',[...ysG][0].ref_no);
    if(ysP.size) return mk('ys_open','Reject · '+([...ysP][0].ref_no||''));
    if(!cr.analysed) return mk('diag', round>1 ? L('รอเปิด JS ใหม่ (ซ่อมครั้งก่อนไม่ผ่าน)','Waiting new JS (previous repair failed)') : '');
    if(cr.test==='pass') return mk('follow');
    if(parts.size){ const ps=[...parts], x=ps.find(p=>p.parts_type==='BO')||ps[0];
      return mk('eta',(x.ref_no||'')+(ps.length>1?` +${ps.length-1}`:'')+(x.d2?' · ETA '+fmt(x.d2):'')); }
    if(cr.test==='ip') return mk('test',cr.testNote);
    if(cr.ordered>0 || cr.assembled || cr.noparts) return mk('test', cr.noparts&&!cr.ordered?L('ไม่ใช้อะไหล่','no parts'):'');
    if(c.cost_band==='gt10k' && !ysFinAny) return mk('ys_open');
    return mk('parts_order',rTag);
  });
  const done=!!(c.delivered_date||c.cancelled_date), endD=c.delivered_date||c.cancelled_date, segs=[], own={P:0,G:0};
  ev.forEach((e,i)=>{
    if(e.k==='delivered'||e.k==='cancel') return;
    const end = ev[i+1] ? ev[i+1].d : (done?null:T); if(!end) return;
    const s=states[i]; if(!s.o) return; const a=e.d<T?e.d:T, b=end<T?end:T, dys=Math.max(0,dd(a,b));
    const p=segs[segs.length-1];
    if(p && p.k===s.k && p.to===e.d){ p.to=end; p.days+=dys; p.open=!ev[i+1]; if(s.detail) p.detail=s.detail; own[s.o]+=dys; return; }   // ขั้นเดิมต่อเนื่อง → รวมเป็นแถวเดียว
    if(!dys && ev[i+1]) return;
    segs.push({k:s.k,o:s.o,detail:s.detail,from:e.d,to:end,days:dys,open:!ev[i+1]}); own[s.o]+=dys;
  });
  const last=ev.length-1;
  const cur = last>=0 ? states[last] : mk('diag');
  const curDays = last>=0 && !done ? Math.max(0,dd(ev[last].d,T)) : 0;
  const total = c.arrival_date ? Math.max(0,dd(c.arrival_date, endD||T)) : 0;
  return {ev,segs,cur,curDays,total,own,done,cancel:!!c.cancelled_date&&!c.delivered_date,round};
}
// วัน GWM / PS ภายใน JS หรือ YS หนึ่งใบ
function stepSplit(s){
  if(!s.d1) return null; const e=stepEv(s).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0), endD=s.kind==='js'?s.d3:(ysFinal(s)?(s.d2||s.d1):null), T=today();
  let side='G', from=s.d1, g=0, p=0; const close=endD||T;
  e.forEach(x=>{ const n=Math.max(0,dd(from,x.d)); if(side==='G') g+=n; else p+=n; side=(x.t==='reply'||x.t==='reject')?'P':'G'; from=x.d; });
  const n=Math.max(0,dd(from,close)); if(side==='G') g+=n; else p+=n;
  return {g,p,loops:e.filter(x=>x.t==='reply'||x.t==='reject').length,closed:!!endD};
}

const curLabel = (t,withDetail=true) => stName(t.cur.k)+(withDetail&&t.cur.detail?' · '+t.cur.detail:'');
function flags(c,t,steps){

  if(t.done) return f;
  if(c.cost_band==='gt10k' && !steps.some(s=>s.kind==='ys') && steps.some(s=>(s.kind==='parts'||s.kind==='assemble')&&s.d1)) f.push(L('เกิน 10,000 ยังไม่ขอ YS','Over 10,000 THB, no YS'));
  if(steps.some(s=>s.kind==='parts' && s.d2 && !s.d3 && s.d2<T)) f.push(L('เลย ETA อะไหล่','Parts past ETA'));
  if(c.est_delivery && c.est_delivery<T) f.push(L('เลยวันนัดส่งมอบ','Past est. delivery'));
  return f;
}
function refsOf(steps,kind){ return (steps||[]).filter(s=>s.kind===kind && s.ref_no).map(s=>s.ref_no); }

// Supabase ส่งได้ครั้งละไม่เกิน 1,000 แถว → ดึงทีละหน้าจนครบ
async function pageAll(make){ const out=[], N=1000; for(let from=0;;from+=N){ const r=await make().range(from,from+N-1); if(r.error) throw r.error; const d=r.data||[]; out.push(...d); if(d.length<N) break; } return out; }
function supaApi(){
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = r => { if(r.error) throw r.error; return r.data; };
  return {
    sb,
    async session(){ return (await sb.auth.getSession()).data.session; },
    async signIn(email,password){ ok(await sb.auth.signInWithPassword({email,password})); },
    async signUp(email,password,meta){ return ok(await sb.auth.signUp({email,password,options:{data:meta}})); },
    async signOut(){ await sb.auth.signOut(); },
    async resetPw(email){ ok(await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname})); },
    async updatePw(pw){ ok(await sb.auth.updateUser({password:pw})); },
    async me(){ const u=(await sb.auth.getUser()).data.user; if(!u) return null;
      return ok(await sb.from('profiles').select('*').eq('user_id',u.id).maybeSingle()); },
    async dealers(){ return ok(await sb.from('dealers').select('*').order('zone').order('name')); },
    async cases(){ return pageAll(()=>sb.from('vor_cases').select('*').order('arrival_date').order('id')); },
    async vinHistory(vin){ // ใช้ฟังก์ชันในฐานข้อมูล (PS เห็นชื่อศูนย์อื่น + วันที่ ไม่เห็นรายละเอียด) · ถ้ายังไม่มีฟังก์ชัน ใช้ข้อมูลที่เห็นอยู่แทน
      const r=await sb.rpc('vin_history',{p_vin:vin}); if(!r.error) return r.data||[];
      const v=vin.trim().toUpperCase();
      return S.cases.filter(c=>(c.vin||'').trim().toUpperCase()===v).map(c=>({id:c.id,dealer_id:c.dealer_id,dealer_name:dName(c.dealer_id),sp:c.sp,arrival_date:c.arrival_date,delivered_date:c.delivered_date,problem_cat:c.problem_cat,symptom:c.symptom,detail:true})); },
    async deleteUser(uid){ const r=await sb.rpc('admin_delete_user',{uid});
      if(r.error && /admin_delete_user|function|schema cache/i.test(r.error.message||'')) throw {message:L('ยังลบในแอปไม่ได้ — ลบที่ Supabase → Authentication → Users → ⋮ → Delete user','Delete isn\'t set up in the app yet — use Supabase → Authentication → Users → ⋮ → Delete user')};
      ok(r); },
    async steps(){ return pageAll(()=>sb.from('vor_steps').select('*').order('round').order('created_at').order('id')); },
    async logs(caseId){ return ok(await sb.from('vor_log').select('*').eq('case_id',caseId).order('id',{ascending:false})); },
    async saveCase(c){
      const r={...c}; delete r.id;
      if(c.id){ if(!Object.keys(r).length) return {id:c.id}; return ok(await sb.from('vor_cases').update(r).eq('id',c.id).select().single()); }
      return ok(await sb.from('vor_cases').insert(r).select().single());
    },
    async syncSteps(caseId, rows, removed){
      if(removed.length) ok(await sb.from('vor_steps').delete().in('id',removed));
      for(const s of rows){ const r={case_id:caseId}; STEP_FIELDS.forEach(k=>{ if(k!=='id') r[k]=s[k]??null; });
        if(!isNew(s.id)) ok(await sb.from('vor_steps').update(r).eq('id',s.id)); else ok(await sb.from('vor_steps').insert(r)); }
    },
    async deleteCase(id){ ok(await sb.from('vor_cases').delete().eq('id',id)); },
    async profiles(){ return ok(await sb.from('profiles').select('*').order('created_at',{ascending:false})); },
    async updateProfile(uid,p){ ok(await sb.from('profiles').update(p).eq('user_id',uid)); },
    async setTempPw(uid,pw){ ok(await sb.rpc('admin_set_password',{uid,pw})); },
    async contacts(){ return ok(await sb.rpc('contacts')) || []; },
    async lastUpdates(){ return pageAll(()=>sb.rpc('last_updates')); },
    async updateMyContact(line,phone){ ok(await sb.rpc('update_my_contact',{p_line:line,p_phone:phone})); },
    async deleteDealer(id){ ok(await sb.from('dealers').delete().eq('id',id)); },
    async svmSetMember(uid,role,cat){ ok(await sb.rpc('svm_set_member',{uid,new_role:role,cat:cat||null})); },
    async rsmSetMember(uid,role,cat){ ok(await sb.rpc('rsm_set_member',{uid,new_role:role,cat:cat||null})); },
    async models(){ const r=await sb.from('vor_models').select('*').order('sort').order('name'); if(r.error) return null; return r.data; },
    async addModel(name){ ok(await sb.from('vor_models').insert({name})); },
    async updModel(id,p){ ok(await sb.from('vor_models').update(p).eq('id',id)); },
    async renameModelOnCases(ids,model){ for(let i=0;i<ids.length;i+=100) ok(await sb.from('vor_cases').update({model}).in('id',ids.slice(i,i+100))); },
    async feed(since){ const r=await sb.from('vor_log').select('id,case_id,dealer_id,kind,action,fields,actor,actor_name,actor_cat,at').gte('at',since).order('id',{ascending:false}).limit(300); return r.error?[]:r.data; },
    async allowed(){ return ok(await sb.from('allowed_emails').select('*').order('created_at',{ascending:false})); },
    async saveAllowed(rows){ ok(await sb.from('allowed_emails').upsert(rows)); },
    async delAllowed(email){ ok(await sb.from('allowed_emails').delete().eq('email',email)); },
    async saveDealer(d){ const r={code:d.code||null,name:d.name,zone:d.zone||null,rsm:d.rsm||null,rsm2:d.rsm2||null,active:d.active!==false};
      if(d.id) ok(await sb.from('dealers').update(r).eq('id',d.id)); else ok(await sb.from('dealers').insert(r)); },
    async bulkDealers(rows){ ok(await sb.from('dealers').insert(rows)); },
    async updDealer(id,patch){ ok(await sb.from('dealers').update(patch).eq('id',id)); },
    subscribe(fn){ let t; const go=()=>{clearTimeout(t);t=setTimeout(fn,600);};
      sb.channel('vor').on('postgres_changes',{event:'*',schema:'public',table:'vor_cases'},go)
        .on('postgres_changes',{event:'*',schema:'public',table:'vor_steps'},go).subscribe(); }
  };
}

/* ===================== โหลดข้อมูล ===================== */
async function loadAll(){
  const [d,c,st] = await Promise.all([api.dealers(), api.cases(), api.steps()]);
  S.dealers=d; S.steps=st; S.stepsBy={};
  S.stepsRaw={}; st.forEach(x=>(S.stepsRaw[x.case_id]=S.stepsRaw[x.case_id]||[]).push(x));
  Object.entries(S.stepsRaw).forEach(([k,a])=>S.stepsBy[k]=a);
  S.cases=c;
  computeAll();
  try{ const [ct,lu]=await Promise.all([api.contacts(),api.lastUpdates()]); S.contacts=ct||[]; S.last={}; (lu||[]).forEach(x=>S.last[x.case_id]=x); }catch(e){ S.contacts=[]; S.last={}; }
  if(!S.psInit && S.me.role==='ps'){ S.psInit=true; if(S.tab==='board') S.tab='mine'; }
  if(!S.rsmInit && isStaff()){ S.rsmInit=true; if(S.tab==='board') S.tab='dash'; const first=(S.me.full_name||'').split(/\s+/)[0].toLowerCase();
    const mine=[...new Set(S.dealers.flatMap(d=>[d.rsm,d.rsm2]).filter(r=>r && first && r.toLowerCase().split(/\s+/)[0]===first))]; if(mine.length===1){ S.f.rsm=mine[0]; S.myRsm=mine[0]; } }
  if(isAdmin()||isSvm()){ const [p,a]=await Promise.all([api.profiles(),api.allowed()]); S.profiles=p; S.allowed=a; }
  else if(S.me.role==='rsm'){ try{ S.profiles=await api.profiles(); }catch(e){ S.profiles=[]; } }
  try{ S.models=await api.models(); }catch(e){ S.models=null; }
  try{ const st=nState(); S.feed=await api.feed(new Date(Math.min(Date.now()-3*864e5, st?Date.parse(st.since):Date.now())).toISOString()); }catch(e){ S.feed=[]; }
}
function computeAll(){ S.cases.forEach(x=>{ const ss=S.stepsBy[x.id]||[]; x._t=timeline(x,ss); x._f=flags(x,x._t,ss); x._todo=x._t.done?[]:todoList(x,ss); }); }
async function reload(){ try{ await loadAll(); renderMain(); }catch(e){ toast(errMsg(e)); } }
function errMsg(e){
  if(!e) return L('เกิดข้อผิดพลาด','Something went wrong');
  if(e.code==='23505') return L('SP นี้มีอยู่แล้วในศูนย์นี้','This SP already exists for this dealer');
  if(/NOT_SELF/.test(e.message||'')) return L('แก้สิทธิ์ของตัวเองไม่ได้','You cannot change your own access');
  if(/NOT_YOUR_STAFF/.test(e.message||'')) return L('ผู้ใช้นี้ไม่ได้อยู่ในศูนย์ของคุณ','This user is not in your service center');
  if(e.code==='42501'||/NOT_ALLOWED|row-level security/.test(e.message||'')) return L('ตำแหน่งของคุณไม่มีสิทธิ์แก้ส่วนนี้','Your position cannot edit this part');
  const m=e.message||String(e);
  if(/Invalid login/i.test(m)) return L('อีเมลหรือรหัสผ่านไม่ถูกต้อง','Wrong email or password');
  if(/already registered/i.test(m)) return L('อีเมลนี้สมัครไว้แล้ว','This email is already registered');
  if(/rate limit/i.test(m)) return L('ระบบรับคำขอเยอะเกินไป รอ 5–10 นาทีแล้วลองใหม่ (ถ้ายังไม่ได้ แจ้ง RSM)','Too many requests — wait 5–10 minutes and try again (or contact your RSM)');
  if(/Email not confirmed/i.test(m)) return L('ยังไม่ได้ยืนยันอีเมล','Email not confirmed');
  return m;
}

/* ===================== Boot / Auth ===================== */
let booting=false;
async function boot(){
  if(booting) return; booting=true;
  document.documentElement.lang=S.lang;
  try{
    if(DEMO){ if(!S.me) S.me={...DEMO_USERS.admin}; await loadAll(); renderApp(); return; }
    if(S.recovery){ renderAuth('newpw'); return; }
    const s=await api.session();
    if(!s){ S.me=null; S.dealers=await api.dealers().catch(()=>[]); renderAuth('login'); return; }
    S.me=await api.me();
    if(!S.me || ['pending','disabled'].includes(S.me.role)){ if(!S.dealers.length) S.dealers=await api.dealers().catch(()=>[]); renderPending(); return; }
    await loadAll(); renderApp();
    if(!S.ready){ S.ready=true; api.subscribe(()=>{ if(!S.edit) reload(); }); }
  }catch(e){ app.innerHTML=`<div class="auth"><div class="authbox"><b>${L('เชื่อมต่อไม่ได้','Cannot connect')}</b><div class="msg err">${esc(errMsg(e))}</div><button class="btn wide" onclick="location.reload()">${L('ลองใหม่','Retry')}</button></div></div>`; }
  finally{ booting=false; }
}
if(!DEMO){
  api.sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){ S.recovery=true; renderAuth('newpw'); return; }
    if(ev==='SIGNED_OUT'){ S.me=null; boot(); }
    else if(ev==='SIGNED_IN' && !(S.me && session && S.me.user_id===session.user.id)) setTimeout(boot,0);
  });
}

function filtered(){
  const f=S.f, q=f.q.trim().toLowerCase();
  const cut=dAgo(180);
  return S.cases.filter(c=>{ const d=dealerById(c.dealer_id)||{};
    if(c.delivered_date && c.delivered_date<cut) return false;
    if(f.rsm && dRsm(d)!==f.rsm) return false;
    if(f.dealer && String(c.dealer_id)!==String(f.dealer)) return false;
    if(f.parked==='y' && !c.parked) return false;
    if(f.parked==='n' && c.parked) return false;
    if(f.prob && (c.problem_cat||'none')!==f.prob) return false;
    if(f.loaner==='y' && !c.loaner) return false;
    if(f.loaner==='n' && c.loaner) return false;
    if(q){ const refs=(S.stepsBy[c.id]||[]).map(s=>s.ref_no||'').join(' ');
      if(![c.sp,c.vin,c.model,refs,c.symptom,c.cause,probName(c.problem_cat)].join(' ').toLowerCase().includes(q)) return false; }
    return true; });
}

const AGE = [['0–7',0,7,'#16a34a'],['8–15',8,15,'#ca8a04'],['16–30',16,30,'#ea580c'],['30+',31,1e9,'#c8102e']];

function donut(parts,total,center,sub){ // parts: [{key,v,color,label}]

  const arcs=parts.filter(p=>p.v>0).map(p=>{ const len=p.v/sum*C, gap=parts.filter(x=>x.v>0).length>1?2:0;
    const a=`<circle class="arc ${S.d.side===p.key?'sel':''}" data-dside="${p.key}" r="${R}" cx="70" cy="70" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(p.label)} ${Math.round(p.v/sum*100)}%</title></circle>`;
    off+=len; return a; }).join('');
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="${esc(parts.map(p=>p.label+' '+Math.round(p.v/sum*100)+'%').join(', '))}">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="#eef0f3" stroke-width="22"/>${arcs}
    <text x="70" y="68" text-anchor="middle" class="dn-v">${esc(center)}</text><text x="70" y="86" text-anchor="middle" class="dn-l">${esc(sub)}</text></svg>`;
}

function periods(mode){ // ช่วงเวลาของกราฟ เคลียรถออก
  const T=new Date(), out=[]; const d0=x=>ymd(x);
  if(mode==='day'){ for(let i=13;i>=0;i--){ const d=new Date(T); d.setDate(d.getDate()-i); const s=d0(d); out.push({key:s,label:s.slice(8,10)+'/'+s.slice(5,7),s,e:s}); } }
  if(mode==='week'){ const m=new Date(T); m.setDate(m.getDate()-((m.getDay()+6)%7));
    for(let i=11;i>=0;i--){ const a=new Date(m); a.setDate(a.getDate()-7*i); const b=new Date(a); b.setDate(b.getDate()+6); const s=d0(a); out.push({key:s,label:s.slice(8,10)+'/'+s.slice(5,7),s,e:d0(b)}); } }
  if(mode==='month'){ for(let i=11;i>=0;i--){ const a=new Date(T.getFullYear(),T.getMonth()-i,1), b=new Date(a.getFullYear(),a.getMonth()+1,0);
      out.push({key:d0(a),label:(S.lang==='en'?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']:['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'])[a.getMonth()]+(a.getMonth()===0||i===11?' '+String(a.getFullYear()).slice(2):''),s:d0(a),e:d0(b)}); } }
  if(mode==='year'){ const ys=S.cases.map(c=>+c.arrival_date.slice(0,4)).filter(Boolean), y0=Math.max(Math.min(T.getFullYear(),...ys),T.getFullYear()-5);
    for(let y=y0;y<=T.getFullYear();y++) out.push({key:y+'',label:y+'',s:y+'-01-01',e:y+'-12-31'}); }
  return out;
}
function throughput(list){

      med:qtl(del.map(c=>dd(c.arrival_date,c.delivered_date)),.5)}; });
}

function alertHit(c,k){ const ss=S.stepsBy[c.id]||[], T=today();
  if(k==='past_due') return c.est_delivery && c.est_delivery<T;
  if(k==='past_eta') return ss.some(s=>s.kind==='parts'&&s.d2&&!s.d3&&s.d2<T);
  if(k==='no_ys') return c.cost_band==='gt10k' && !ss.some(s=>s.kind==='ys');
  if(k==='todo') return (c._todo||[]).length>0;
  return false; }

function drillDef(key){ const [a,b,c2]=key.split(':'), T=today();
  const open=x=>!x._t.done;
  if(a==='open') return [L('รถค้างทั้งหมด','All open vehicles'),open];
  if(a==='own') return [L('ค้างที่ ','Waiting on ')+(b==='G'?'GWM':'Partner (PS)'),x=>open(x)&&x._t.cur.o===b];
  if(a==='rep') return [L('ซ่อมซ้ำ (รอบ 2+)','Repeat repair'),x=>open(x)&&x._t.round>1];
  if(a==='parked') return [L('รถจอด','Parked vehicles'),x=>open(x)&&x.parked];
  if(a==='loaner') return [L('มีรถใช้ระหว่างซ่อม','Loaner cars out'),x=>open(x)&&x.loaner];
  if(a==='st') return [stName(b),x=>open(x)&&x._t.cur.k===b];
  if(a==='dept'){ const ks=(DEPTS[b].find(d=>d[0]===c2)||[0,[]])[1]; return [deptName(b,c2),x=>open(x)&&ks.includes(x._t.cur.k)]; }
  if(a==='age'){ const g=AGE[+b]; return [L('ค้าง ','Open ')+g[0]+L(' วัน',' days'),x=>open(x)&&x._t.total>=g[1]&&x._t.total<=g[2]]; }
  if(a==='prob') return [b==='none'?L('ยังไม่ระบุปัญหา','Problem not set'):probName(b),x=>open(x)&&(x.problem_cat||'none')===b];
  if(a==='alert') return [{past_due:L('เลยวันนัดส่งมอบ','Past est. delivery'),past_eta:L('อะไหล่เลย ETA','Parts past ETA'),no_ys:L('เกิน 10,000 ยังไม่มี YS','Over 10k, no YS'),todo:L('ข้อมูลยังไม่ครบ','Incomplete info')}[b],x=>open(x)&&alertHit(x,b)];
  if(a==='del'){ const tp=periods(S.d.per), sel=tp.find(p=>p.key===S.d.bucket), s=sel?sel.s:tp[0].s, e=sel?sel.e:tp[tp.length-1].e;
    return [L('ส่งมอบแล้ว ','Delivered ')+(sel?sel.label:''),x=>x.delivered_date&&x.delivered_date>=s&&x.delivered_date<=e,true]; }
  return [key,()=>false];
}

const newStep = (kind,round,x) => Object.assign({id:'new'+Math.random().toString(36).slice(2),kind,round},x||{});
const curRound = () => { const ss=S.edit.steps, r=Math.max(1,...ss.map(s=>s.round||1)); return ss.some(s=>s.kind==='test'&&s.round===r&&s.result==='fail') ? r+1 : r; };
function ensureRoundSteps(){ // ทุกครั้งมีช่อง "ช่างวิเคราะห์" "ประกอบ" "ทดสอบ"
  for(let r=1;r<=curRound();r++) (r===1?['diag','assemble','test']:['assemble','test']).forEach(k=>{ if(!S.edit.steps.some(s=>s.kind===k&&s.round===r)) S.edit.steps.push(newStep(k,r)); });
}
function legacySteps(c,steps){ // แปลงข้อมูลแบบเดิมให้อยู่ในรูปแบบใหม่ (ตอนเปิดฟอร์ม)
  steps.forEach(s=>{
    if(!Array.isArray(s.ev)) s.ev=[];
    if(s.kind==='js' && s.d2 && !s.ev.length){ s.ev=[{t:'reply',d:s.d2}]; s.d2=null; }
    if(s.kind==='ys' && s.result==='rejected'){ if(!s.ev.length) s.ev=[{t:'reject',d:s.d2||s.d1}]; s.result=null; s.d2=null; }
  });
  if(c.analysis_date && !steps.some(s=>s.kind==='diag'&&s.round===1&&s.d1))
    steps.push(newStep('diag',1,{d1:c.analysis_date,result:steps.some(s=>s.kind==='js'&&(s.round||1)===1)?'js':'parts'}));
}
function openCase(id, dropCol){
  const base = id ? S.cases.find(x=>x.id===id) : {dealer_id: S.me.role==='ps'?S.me.dealer_id:(S.f.dealer||''), arrival_date:today(), parked:true, loaner:false, cost_band:'le10k'};
  const c={}; Object.keys(base).forEach(k=>{ if(!k.startsWith('_')) c[k]=base[k]; });
  const steps=(id?((S.stepsRaw||{})[id]||S.stepsBy[id]||[]):[]).map(s=>({...s,ev:Array.isArray(s.ev)?s.ev.map(e=>({...e})):[]}));
  legacySteps(c,steps);
  S.edit={c,steps,removed:[],id,logs:[],orig:id?normCase(c):null,origSteps:Object.fromEntries(normSteps(steps).map(s=>[s.id,s]))};
  ensureRoundSteps();
  if(dropCol){
    if(c.delivered_date && dropCol!=='done') c.delivered_date=null;   // ลากออกจาก "ส่งมอบแล้ว" = ยกเลิกวันส่งมอบ
    const T=today(), r=curRound(), st=k=>S.edit.steps.find(s=>s.kind===k&&s.round===r), ss=S.edit.steps;
    const closeReplied=()=>ss.filter(s=>s.kind==='js'&&s.d2&&!s.d3).forEach(s=>s.d3=T);
    switch(dropCol){
      case 'js_wait': if(!ss.some(s=>s.kind==='js'&&s.d1&&!s.d3)) ss.push(newStep('js',r,{d1:T})); break;
      case 'js_close': { const w=ss.filter(s=>s.kind==='js'&&s.d1&&!s.d2&&!s.d3); w.forEach(s=>s.d2=T); break; }
      case 'ys_open': if(!c.analysis_date) c.analysis_date=T; closeReplied(); c.cost_band='gt10k'; break;
      case 'ys_wait': ss.push(newStep('ys',r,{d1:T})); c.cost_band='gt10k'; break;
      case 'parts_order': if(!c.analysis_date) c.analysis_date=T; closeReplied();
        ss.filter(s=>s.kind==='ys'&&s.d1&&!s.result).forEach(s=>{ s.result='approved'; s.d2=T; }); break;
      case 'eta': ss.push(newStep('parts',r,{d1:T})); break;
      case 'test': { const op=ss.filter(s=>s.kind==='parts'&&s.d1&&!s.d3); if(op.length) op.forEach(s=>s.d3=T); else st('assemble').d1=T; break; }
      case 'follow': { const a=st('assemble'); if(!a.d1) a.d1=T; const x=st('test'); x.d1=T; x.result='pass'; break; }
      case 'done': c.delivered_date=T; break;
    }
    S.edit.hint=L('ใส่วันที่วันนี้ให้แล้ว — กรอกเลขอ้างอิงให้ครบ แล้วกด "บันทึก"','Today\'s date has been filled in — complete the reference numbers, then press "Save"');
  }
  renderModal();
  if(id){ const E=S.edit; api.logs(id).then(l=>{ if(S.edit===E){ E.logs=l||[]; renderStamps(); } }).catch(()=>{}); }
}

function dateRow(f,label,v){ return `<label class="drow">${label}${dateIn(`data-c="${f}"`,v)}</label>`; }
function radio(name,attr,opts,val){ return `<div class="radios">${opts.map(o=>`<label><input type="radio" name="${name}" ${attr} value="${o[0]}" ${String(val)===String(o[0])?'checked':''}> ${o[1]}</label>`).join('')}</div>`; }
function sIn(i,f,label,v,ph){ return `<label class="drow">${label}<input data-s="${i}" data-sf="${f}" value="${esc(v||'')}" placeholder="${ph||''}" autocapitalize="characters"></label>`; }

const EV_L = { reply:['GWM ตอบ','GWM replied'], send:['ส่งข้อมูลเพิ่ม','Sent more info'], reject:['Warranty Reject','Warranty rejected'], resubmit:['ส่ง YS ใหม่','YS resubmitted'] };
function evRows(s,i){ // รายการตอบกลับของ JS / YS (เพิ่มได้ไม่จำกัด)
  const types = s.kind==='js' ? ['reply','send'] : ['reject','resubmit'];
  const sp=stepSplit(s);
  return `<div class="evs"><div class="evh">${s.kind==='js'?L('การตอบกลับ GWM Technical ⇄ Foreman (เพิ่มได้ไม่จำกัด)','GWM Technical ⇄ Foreman replies'):L('Warranty Reject / ส่ง YS ใหม่ (เลขเดิม)','Warranty reject / resubmit (same no.)')}</div>${(s.ev||[]).map((e,j)=>`<div class="evr ${e.t==='reply'||e.t==='reject'?'g':'p'}">
      <select data-ev="${i}" data-ej="${j}" data-ef="t">${types.map(t=>`<option value="${t}" ${e.t===t?'selected':''}>${L(...EV_L[t])}</option>`).join('')}</select>
      ${dateIn(`data-ev="${i}" data-ej="${j}" data-ef="d"`,e.d)}
      <input data-ev="${i}" data-ej="${j}" data-ef="note" value="${esc(e.note||'')}" placeholder="${L('หมายเหตุ','note')}">
      <button type="button" class="rm" data-rmev="${i}" data-ej="${j}" title="${L('ลบ','Delete')}">✕</button></div>`).join('')}

    ${sp&&(sp.g||sp.p)?`<div class="mut sm">⏱ GWM <b style="color:${OWN.G.c}">${sp.g}</b> ${L('วัน','d')} · PS <b style="color:${OWN.P.c}">${sp.p}</b> ${L('วัน','d')} · ${L('ตอบกลับ','replies')} ${sp.loops} ${L('รอบ','×')}${sp.closed?'':' · '+L('ยังไม่ปิด','still open')}</div>`:''}</div>`;

function stepBlock(s,i,no){
  const nn = no ? ` ${L('ครั้งที่','#')} ${no}` : '';
  const rm = canStep(s.kind) ? `<button type="button" class="rm" data-rmstep="${i}" title="${L('ลบ','Delete')}">🗑</button>` : '';
  const st = isNew(s.id) ? '' : `<div class="stamp" data-step="${s.id}"></div>`;
  if(s.kind==='js') return `<div class="srow js">${rm}<div class="rt">${L('เปิด JS'+nn+' <small>· ขอสนับสนุนทางเทคนิค (เลขเดิมจนกว่าจะปิด)</small>','Open JS'+nn+' <small>· Technical support (same no. until closed)</small>')}</div>
    ${sIn(i,'ref_no',L('เลข JS','JS no.'),s.ref_no,'JS-…')}${sDate(i,'d1',L('วันที่เปิด JS','Opened'),s.d1)}
    ${evRows(s,i)}${sDate(i,'d3',L('วันที่ Foreman ปิด JS','Closed by foreman'),s.d3)}${st}</div>`;
  if(s.kind==='ys') return `<div class="srow ys">${rm}<div class="rt">${L('เปิด YS'+nn+' <small>· ขออนุมัติก่อนซ่อม (เลขเดิมแม้ถูก Reject)</small>','Open YS'+nn+' <small>· Pre-approval (same no. after reject)</small>')}</div>
    ${sIn(i,'ref_no',L('เลข YS','YS no.'),s.ref_no,'YS-…')}${sDate(i,'d1',L('วันที่ขอ YS','Request date'),s.d1)}
    ${evRows(s,i)}
    <label class="drow">${L('ผลสุดท้าย','Final result')}<select data-s="${i}" data-sf="result"><option value="">${L('— ยังไม่จบ —','— Not final —')}</option><option value="approved" ${s.result==='approved'?'selected':''}>${L('อนุมัติ','Approved')}</option><option value="nocover" ${s.result==='nocover'?'selected':''}>${L('ไม่เคลม – ลูกค้าจ่ายเอง','Not covered – customer pays')}</option></select></label>
    ${sDate(i,'d2',L('วันที่ได้ผลสุดท้าย','Final result date'),s.d2)}${st}</div>`;
  if(s.kind==='parts') return `<div class="srow parts">${rm}<div class="rt">${L('เปิด '+(s.parts_type||'PO / BO')+nn+' <small>· PS สั่งอะไหล่แล้ว รอ GWM ส่ง</small>','Open '+(s.parts_type||'PO / BO')+nn+' <small>· ordered by PS, awaiting GWM delivery</small>')}</div>
    <label class="drow">${L('ประเภท','Type')}${radio('pt_'+i,`data-s="${i}" data-sf="parts_type"`,[['PO','PO'],['BO','BO']],s.parts_type||'')}</label>
    ${sIn(i,'ref_no',L('เลข PO / BO','PO / BO no.'),s.ref_no,(s.parts_type||'PO')+'-…')}${sDate(i,'d1',L('วันที่สั่ง','Order date'),s.d1)}${sDate(i,'d2','ETA',s.d2,1)}${sDate(i,'d3',L('วันที่อะไหล่มาถึง','Parts arrival date'),s.d3)}${st}</div>`;
  return '';
}

function renderStamps(){
  const E=S.edit; if(!E) return; const logs=E.logs||[], co=E.id&&S.cases.find(x=>x.id===E.id);
  document.querySelectorAll('#modal .stamp[data-step]').forEach(el=>{ el.innerHTML=stampHtml(logs.find(l=>l.step_id===el.dataset.step),co); });
  document.querySelectorAll('#modal .stamp[data-sec]').forEach(el=>{ const fs=SEC_FIELDS[el.dataset.sec];
    el.innerHTML=stampHtml(logs.find(l=>l.kind==='case'&&(l.fields||[]).some(f=>fs.includes(f))),co); });
  const h=$('#hist'); if(!h) return;
  h.innerHTML = logs.length ? `<details><summary>${L('ประวัติการบันทึก','Edit history')} (${logs.length})</summary>${logs.map(l=>{
      const what=(L(...(KIND_L[l.kind]||[l.kind,l.kind])))+(l.action==='insert'&&l.kind!=='case'?' · '+L('เพิ่ม','added'):l.action==='delete'?' · '+L('ลบ','deleted'):'')
        +(l.fields&&l.kind==='case'||l.action==='update'?' · '+[...new Set((l.fields||[]).map(f=>L(...(FIELD_L[f]||[f,f]))))].join(', '):'');
      return `<div class="seg-row"><span class="mut sm" style="min-width:74px">${fmtTs(l.at)}</span><span><b>${esc(l.actor_name||'?')}</b> <span class="mut sm">(${esc(catName(l.actor_cat))})</span> ${contactIcons(l.actor,co)}</span><span class="d" style="font-weight:400">${esc(what)}</span></div>`; }).join('')}</details>` : '';
}
function applyPerms(){ // ปิดช่องที่ตำแหน่งนี้ไม่มีสิทธิ์กรอก (ฐานข้อมูลก็บังคับซ้ำอีกชั้น)
  if(FULL()) return;
  const m=$('#modal');
  m.querySelectorAll('[data-c]').forEach(el=>{ if(!canField(el.dataset.c)) lock(el); });
  if(!canField('model')) m.querySelectorAll('[data-msel]').forEach(lock);
  m.querySelectorAll('[data-s]').forEach(el=>{ const s=S.edit.steps[+el.dataset.s]; if(s && !canStep(s.kind)) lock(el); });
  m.querySelectorAll('[data-addstep]').forEach(b=>{ if(!canStep(b.dataset.addstep)) b.remove(); });
  m.querySelectorAll('.newbar [data-na]').forEach(b=>{ if(!canStep({njs:'js',nys:'ys',npo:'parts'}[b.dataset.na])) b.remove(); });
  m.querySelectorAll('[data-act="newround"]').forEach(b=>{ if(!canStep('js')) b.remove(); });
}
function lock(el){ el.disabled=true; const w=el.closest('.dwrap'); if(w) w.querySelectorAll('button').forEach(b=>b.disabled=true);

async function saveCase(noRead){

  const d1=ss.find(s=>s.kind==='diag'&&s.round===1); if(d1&&d1.d1) E.c.analysis_date=d1.d1;
  const c=normCase(E.c);

  let payload=c;
  if(E.id){ payload={id:E.id}; Object.keys(c).forEach(k=>{ if(k!=='id' && JSON.stringify(c[k]??null)!==JSON.stringify(E.orig[k]??null)) payload[k]=c[k]; }); }
  const changed=ss.filter(s=>{ const o=E.origSteps[s.id]; return !o || STEP_FIELDS.some(k=>JSON.stringify(s[k]??null)!==JSON.stringify(o[k]??null)); });
  const keep=new Set(ss.map(s=>s.id));
  const removed=[...new Set([...E.removed, ...Object.keys(E.origSteps).filter(id=>!keep.has(id))])].filter(id=>!isNew(id));
  if(E.id && Object.keys(payload).length===1 && !changed.length && !removed.length){ closeModal(); return; }
  saving=true;
  const td=todoList(c,ss);
  try{ const saved=await api.saveCase(payload); await api.syncSteps(saved.id||E.id, changed, removed); closeModal(); await reload();
    toast(td.length?L('บันทึกแล้ว · ยังขาด '+td.length+' รายการ (ขึ้นที่การ์ด)','Saved · '+td.length+' item(s) still missing (shown on the card)'):L('บันทึกแล้ว','Saved')); }
  catch(e){ toast(errMsg(e)); } finally{ saving=false; }
}

function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok,no)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload=()=>ok(window.XLSX); sc.onerror=()=>no({message:L('โหลดตัวอ่าน Excel ไม่ได้ ลองใหม่อีกครั้ง','Could not load the Excel reader, try again')}); document.head.appendChild(sc); }); }
const dKey = n => String(n||'').toLowerCase().replace(/^\s*gwm\s+/,'').replace(/[^a-z0-9ก-๙]/g,'');
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const m=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=m[0]; m[0]=i; for(let j=1;j<=b.length;j++){ const t=m[j]; m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return m[b.length]; }
function matchDealer(code,name){ if(code){ const x=S.dealers.find(d=>d.code&&String(d.code)===String(code)); if(x) return x; }
  const k=dKey(name), ex=S.dealers.find(d=>dKey(d.name)===k); if(ex) return ex;
  if(k.length<8) return null; const near=S.dealers.filter(d=>lev(dKey(d.name),k)<=2); return near.length===1?near[0]:null; }
async function rsmUpload(file){
  try{ const X=await loadXLSX(), wb=X.read(await file.arrayBuffer(),{type:'array'}), n=v=>String(v??'').toLowerCase().replace(/[^a-z0-9ก-๙]/g,''), sets=[];
    wb.SheetNames.forEach(sn=>{ const rows=X.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      for(let r=0;r<Math.min(30,rows.length);r++){ const h=rows[r].map(n), rc=h.findIndex(x=>/^rsm\d*$/.test(x)), sc=h.findIndex(x=>/^(partnerstore|storename|store|partner|partnername|dealer|dealername|psname)$/.test(x));
        if(rc<0||sc<0) continue; const cc=h.findIndex(x=>/pscode|partnercode|^code$/.test(x)), gc=h.findIndex(x=>/region|zone|ภาค/.test(x)), list=[];
        rows.slice(r+1).forEach(w=>{ const st=String(w[sc]||'').trim(), rs=String(w[rc]||'').trim(); if(st&&rs&&!/^rsm\d*$/i.test(rs)) list.push({code:cc>=0?String(w[cc]||'').trim():'',name:st,zone:gc>=0?String(w[gc]||'').trim():'',rsm:rs}); });
        if(list.length){ sets.push({sheet:sn,list}); break; } } });

  }catch(e){ toast(errMsg(e)); }

  try{
    if(f.id==='fLogin'){ await api.signIn(fd.get('email').trim(), fd.get('pw')); setTimeout(boot,0); }
    if(f.id==='fForgot'){ try{ await api.resetPw(fd.get('email').trim()); renderAuth('login',L('ส่งลิงก์ตั้งรหัสใหม่ไปที่อีเมลแล้ว (เช็กใน Junk ด้วย)','Reset link sent — check your inbox (and junk)')); }
      catch(err){ renderAuth('forgot',L('ส่งอีเมลไม่ได้ — ติดต่อ RSM เพื่อขอรหัสชั่วคราว','Could not send email — ask your RSM for a temporary password'),true); } return; }
    if(f.id==='fContact'){ await api.updateMyContact(fd.get('line').trim(), fd.get('phone').trim()); S.me.line_id=fd.get('line').trim()||null; S.me.phone=fd.get('phone').trim()||null; toast(L('บันทึกแล้ว','Saved')); try{ S.contacts=await api.contacts(); }catch(_){} $('#modal').classList.add('hidden'); renderMain(); return; }
    if(f.id==='fChPw'){ if(fd.get('pw')!==fd.get('pw2')){ toast(L('รหัสทั้งสองช่องไม่ตรงกัน','The two passwords do not match')); return; }
      if(!DEMO) await api.updatePw(fd.get('pw')); $('#modal').classList.add('hidden'); $('#modal').innerHTML=''; toast(L('เปลี่ยนรหัสผ่านแล้ว','Password changed')); return; }
    if(f.id==='fNewPw'){ await api.updatePw(fd.get('pw')); S.recovery=false; toast(L('ตั้งรหัสใหม่แล้ว','Password updated')); history.replaceState(null,'',location.pathname); boot(); return; }
    if(f.id==='fSignup'){
      const cat=fd.get('cat'), role=cat==='rsm'?'rsm':'ps';
      if(cat==='owner_svm' && (!(fd.get('line')||'').trim() || !(fd.get('phone')||'').trim())){ renderAuth('signup', L('Owner / SVM ต้องใส่ LINE ID และเบอร์โทร','Owner / SVM must enter a LINE ID and phone'), true); return; }
      const r=await api.signUp(fd.get('email').trim(), fd.get('pw'), {full_name:fd.get('name').trim(), category: role==='ps'?cat:'', requested_role:role, dealer_id: role==='ps'?fd.get('dealer'):'', line_id:(fd.get('line')||'').trim(), phone:(fd.get('phone')||'').trim()});
      if(!r.session) renderAuth('login',L('สมัครเรียบร้อย กรุณายืนยันอีเมล (ถ้ามี) แล้วรอ RSM อนุมัติ','Signed up. Confirm your email (if asked), then wait for RSM approval.'));
    }
  }catch(err){ if(f.id==='fChPw'||f.id==='fContact'){ toast(errMsg(err)); } else renderAuth(f.id==='fLogin'?'login':f.id==='fNewPw'?'newpw':'signup', errMsg(err), true); }
  finally{ btn.disabled=false; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.edit) closeModal(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && S.me && !S.edit && !DEMO && $('#main')) reload(); });

boot();

</script>
</body>
