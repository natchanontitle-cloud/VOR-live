.msgbox{white-space:pre-wrap;font-family:inherit;font-size:13px;background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:10px;margin:0}

.ctag{font-size:10.5px;background:#ecfdf5;color:#047857;border-radius:99px;padding:1px 7px;font-weight:600}
.poshead{font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 0;text-transform:none}.warnmsg{background:#fef3c7;color:#92400e;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.todo{font-size:11px;color:#1d4ed8;background:#eff6ff;border-radius:6px;padding:3px 7px;margin-top:6px}.todo.inl{display:inline-block;margin:2px 0}
.cic{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle}.cic a{font-size:11px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:1px 7px;background:#fff;color:var(--ink)}

/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#fff 0%,#fdecef 100%)}
.authbox{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(200,16,46,.12);padding:26px;width:min(400px,100%)}
.authbox .brand{font-size:24px}
.authbox form{display:flex;flex-direction:column;gap:12px;margin-top:14px}

.msg{margin-top:12px;font-size:13px;padding:10px;border-radius:8px;background:#f3f4f6}

.urow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;z-index:80;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

function timeline(c, steps){
  const T=today(), ev=[];
  const add=(d,k,r,s)=>{ if(d) ev.push({d,k,r,s,rd:s?(s.round||1):0}); };
  add(c.arrival_date,'arrival',0);
  add(c.analysis_date,'analysis',1);
  (steps||[]).forEach(s=>{ const R=(s.round||1)*10;
    if(s.kind==='js'){ add(s.d1,'js_req',R+1,s); add(s.d2,'js_rep',R+1.1,s); add(s.d3,'js_close',R+1.2,s); }
    if(s.kind==='ys'){ add(s.d1,'ys_req',R+2,s); if(s.result) add(s.d2, s.result==='rejected'?'ys_rej':'ys_app', R+2.1,s); }
    if(s.kind==='parts'){ add(s.d1,'parts_order',R+3,s); add(s.d3,'parts_arr',R+3.1,s); }
    if(s.kind==='assemble') add(s.d1,'assemble',R+4,s);
    if(s.kind==='test' && s.result) add(s.d1, s.result==='fail'?'test_fail':s.result==='pass'?'test_pass':'test_ip', R+5,s);
  });
  add(c.customer_contact_date,'contact',900);
  add(c.delivered_date,'delivered',901);
  ev.sort((a,b)=> a.d===b.d ? a.r-b.r : (a.d<b.d?-1:1));

  const jsW=new Set(), jsR=new Set(), ys=new Set(), parts=new Set(), RI={};
  const ri=r=>RI[r]=RI[r]||{ordered:0,assembled:false,test:null,ysApp:false,ysRej:false};
  let round=1, analysed=false, hadStep=false, ysAppAny=false;
  const mk=(k,detail)=>({k, o:ST[k].o, detail:detail||''});
  const states=ev.map(e=>{
    const s=e.s; if(e.rd>round) round=e.rd; if(s) hadStep=true;
    switch(e.k){
      case 'analysis': analysed=true; break;
      case 'js_req': jsW.add(s); break;
      case 'js_rep': jsW.delete(s); jsR.add(s); break;
      case 'js_close': jsW.delete(s); jsR.delete(s); break;
      case 'ys_req': ys.add(s); break;
      case 'ys_app': ys.delete(s); ri(e.rd).ysApp=true; ri(e.rd).ysRej=false; ysAppAny=true; break;
      case 'ys_rej': ys.delete(s); ri(e.rd).ysRej=true; break;
      case 'parts_order': parts.add(s); ri(e.rd).ordered++; break;
      case 'parts_arr': parts.delete(s); break;
      case 'assemble': ri(e.rd).assembled=true; break;
      case 'test_pass': ri(e.rd).test='pass'; break;
      case 'test_fail': ri(e.rd).test='fail'; break;
      case 'test_ip': ri(e.rd).test='ip'; ri(e.rd).testNote = s.result==='other' ? (s.note||L('อื่นๆ','Other')) : L('อยู่ระหว่างทดสอบ / เก็บข้อมูล','Testing / collecting data')+(s.note?' · '+s.note:''); break;
    }
    if(e.k==='delivered') return mk('done');
    const cr=ri(round);
    if(jsW.size) return mk('js_wait',[...jsW][0].ref_no);
    if(ys.size)  return mk('ys_wait',[...ys][0].ref_no);
    if(parts.size){ const ps=[...parts], x=ps.find(p=>p.parts_type==='BO')||ps[0];
      return mk('eta',(x.ref_no||'')+(ps.length>1?` +${ps.length-1}`:'')+(x.d2?' · ETA '+fmt(x.d2):'')); }
    if(jsR.size) return mk('js_close',[...jsR][0].ref_no);
    if(!analysed && !hadStep) return mk('diag');
    if(cr.test==='pass') return mk('follow');
    if(cr.test==='fail') return mk('decide',L('ทดสอบไม่ผ่าน – เปิด JS ใหม่','Test failed – open new JS'));
    if(cr.test==='ip') return mk('test',cr.testNote);
    if(cr.ordered>0 || cr.assembled) return mk('test');
    if(cr.ysRej && !cr.ysApp) return mk('decide','Warranty Reject');
    if(c.cost_band==='gt10k' && !ysAppAny) return mk('ys_open');
    return mk('parts_order');
  });
  const done=!!c.delivered_date, segs=[], own={P:0,G:0};
  ev.forEach((e,i)=>{
    if(e.k==='delivered') return;
    const end = ev[i+1] ? ev[i+1].d : (done?null:T); if(!end) return;
    const s=states[i], dys=Math.max(0,dd(e.d,end));
    segs.push({k:s.k,o:s.o,detail:s.detail,from:e.d,to:end,days:dys,open:!ev[i+1]}); own[s.o]+=dys;
  });
  const last=ev.length-1;
  const cur = last>=0 ? states[last] : mk('diag');
  const curDays = last>=0 && !done ? Math.max(0,dd(ev[last].d,T)) : 0;
  const total = c.arrival_date ? Math.max(0,dd(c.arrival_date, c.delivered_date||T)) : 0;
  const maxRound = Math.max(1,...(steps||[]).map(s=>s.round||1));
  return {ev,segs,cur,curDays,total,own,done,round:maxRound};
}
const curLabel = (t,withDetail=true) => stName(t.cur.k)+(withDetail&&t.cur.detail?' · '+t.cur.detail:'');
function flags(c,t,steps){
  const T=today(), f=[]; steps=steps||[];
  if(t.done) return f;
  if(c.cost_band==='gt10k' && !steps.some(s=>s.kind==='ys') && steps.some(s=>(s.kind==='parts'||s.kind==='assemble')&&s.d1)) f.push(L('เกิน 10,000 ยังไม่ขอ YS','Over 10,000 THB, no YS'));
  if(steps.some(s=>s.kind==='parts' && s.d2 && !s.d3 && s.d2<T)) f.push(L('เลย ETA อะไหล่','Parts past ETA'));
  if(c.est_delivery && c.est_delivery<T) f.push(L('เลยวันนัดส่งมอบ','Past est. delivery'));
  return f;
}

function supaApi(){
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = r => { if(r.error) throw r.error; return r.data; };
  return {
    sb,
    async session(){ return (await sb.auth.getSession()).data.session; },
    async signIn(email,password){ ok(await sb.auth.signInWithPassword({email,password})); },
    async signUp(email,password,meta){ return ok(await sb.auth.signUp({email,password,options:{data:meta}})); },
    async signOut(){ await sb.auth.signOut(); },
    async resetPw(email){ ok(await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname})); },
    async updatePw(pw){ ok(await sb.auth.updateUser({password:pw})); },
    async me(){ const u=(await sb.auth.getUser()).data.user; if(!u) return null;
      return ok(await sb.from('profiles').select('*').eq('user_id',u.id).maybeSingle()); },
    async dealers(){ return ok(await sb.from('dealers').select('*').order('zone').order('name')); },
    async cases(){ const cut=dAgo(180);
      return ok(await sb.from('vor_cases').select('*').or('delivered_date.is.null,delivered_date.gte.'+cut).order('arrival_date')); },
    async steps(){ return ok(await sb.from('vor_steps').select('*').order('round').order('created_at')); },
    async logs(caseId){ return ok(await sb.from('vor_log').select('*').eq('case_id',caseId).order('id',{ascending:false})); },
    async saveCase(c){
      const r={...c}; delete r.id;
      if(c.id){ if(!Object.keys(r).length) return {id:c.id}; return ok(await sb.from('vor_cases').update(r).eq('id',c.id).select().single()); }
      return ok(await sb.from('vor_cases').insert(r).select().single());
    },
    async syncSteps(caseId, rows, removed){
      if(removed.length) ok(await sb.from('vor_steps').delete().in('id',removed));
      for(const s of rows){ const r={case_id:caseId}; STEP_FIELDS.forEach(k=>{ if(k!=='id') r[k]=s[k]??null; });
        if(!isNew(s.id)) ok(await sb.from('vor_steps').update(r).eq('id',s.id)); else ok(await sb.from('vor_steps').insert(r)); }
    },
    async deleteCase(id){ ok(await sb.from('vor_cases').delete().eq('id',id)); },
    async profiles(){ return ok(await sb.from('profiles').select('*').order('created_at',{ascending:false})); },
    async updateProfile(uid,p){ ok(await sb.from('profiles').update(p).eq('user_id',uid)); },
    async setTempPw(uid,pw){ ok(await sb.rpc('admin_set_password',{uid,pw})); },
    async contacts(){ return ok(await sb.rpc('contacts')) || []; },
    async lastUpdates(){ return ok(await sb.rpc('last_updates')) || []; },
    async updateMyContact(line,phone){ ok(await sb.rpc('update_my_contact',{p_line:line,p_phone:phone})); },
    async deleteDealer(id){ ok(await sb.from('dealers').delete().eq('id',id)); },
    async svmSetMember(uid,role,cat){ ok(await sb.rpc('svm_set_member',{uid,new_role:role,cat:cat||null})); },
    async allowed(){ return ok(await sb.from('allowed_emails').select('*').order('created_at',{ascending:false})); },
    async saveAllowed(rows){ ok(await sb.from('allowed_emails').upsert(rows)); },
    async delAllowed(email){ ok(await sb.from('allowed_emails').delete().eq('email',email)); },
    async saveDealer(d){ const r={code:d.code||null,name:d.name,zone:d.zone||null,rsm:d.rsm||null,active:d.active!==false};
      if(d.id) ok(await sb.from('dealers').update(r).eq('id',d.id)); else ok(await sb.from('dealers').insert(r)); },
    async bulkDealers(rows){ ok(await sb.from('dealers').insert(rows)); },
    subscribe(fn){ let t; const go=()=>{clearTimeout(t);t=setTimeout(fn,600);};
      sb.channel('vor').on('postgres_changes',{event:'*',schema:'public',table:'vor_cases'},go)
        .on('postgres_changes',{event:'*',schema:'public',table:'vor_steps'},go).subscribe(); }
  };
}

async function loadAll(){
  const [d,c,st] = await Promise.all([api.dealers(), api.cases(), api.steps()]);
  S.dealers=d; S.steps=st; S.stepsBy={};
  st.forEach(x=>(S.stepsBy[x.case_id]=S.stepsBy[x.case_id]||[]).push(x));
  S.cases=c;
  computeAll();
  try{ const [ct,lu]=await Promise.all([api.contacts(),api.lastUpdates()]); S.contacts=ct||[]; S.last={}; (lu||[]).forEach(x=>S.last[x.case_id]=x); }catch(e){ S.contacts=[]; S.last={}; }
  if(!S.rsmInit && isStaff()){ S.rsmInit=true; const first=(S.me.full_name||'').split(/\s+/)[0].toLowerCase();
    const mine=[...new Set(S.dealers.map(d=>d.rsm).filter(r=>r && first && r.toLowerCase().split(/\s+/)[0]===first))]; if(mine.length===1) S.f.rsm=mine[0]; }
  if(isAdmin()||isSvm()){ const [p,a]=await Promise.all([api.profiles(),api.allowed()]); S.profiles=p; S.allowed=a; }
}
function computeAll(){ S.cases.forEach(x=>{ const ss=S.stepsBy[x.id]||[]; x._t=timeline(x,ss); x._f=flags(x,x._t,ss); x._todo=x._t.done?[]:todoList(x,ss); }); }
async function reload(){ try{ await loadAll(); renderMain(); }catch(e){ toast(errMsg(e)); } }
function errMsg(e){
  if(!e) return L('เกิดข้อผิดพลาด','Something went wrong');
  if(e.code==='23505') return L('SP นี้มีอยู่แล้วในศูนย์นี้','This SP already exists for this dealer');
  if(/NOT_SELF/.test(e.message||'')) return L('แก้สิทธิ์ของตัวเองไม่ได้','You cannot change your own access');
  if(/NOT_YOUR_STAFF/.test(e.message||'')) return L('ผู้ใช้นี้ไม่ได้อยู่ในศูนย์ของคุณ','This user is not in your service center');
  if(e.code==='42501'||/NOT_ALLOWED|row-level security/.test(e.message||'')) return L('ตำแหน่งของคุณไม่มีสิทธิ์แก้ส่วนนี้','Your position cannot edit this part');
  const m=e.message||String(e);
  if(/Invalid login/i.test(m)) return L('อีเมลหรือรหัสผ่านไม่ถูกต้อง','Wrong email or password');
  if(/already registered/i.test(m)) return L('อีเมลนี้สมัครไว้แล้ว','This email is already registered');
  if(/Email not confirmed/i.test(m)) return L('ยังไม่ได้ยืนยันอีเมล','Email not confirmed');
  return m;
}

let booting=false;
async function boot(){
  if(booting) return; booting=true;
  document.documentElement.lang=S.lang;
  try{
    if(DEMO){ if(!S.me) S.me={...DEMO_USERS.admin}; await loadAll(); renderApp(); return; }
    if(S.recovery){ renderAuth('newpw'); return; }
    const s=await api.session();
    if(!s){ S.me=null; S.dealers=await api.dealers().catch(()=>[]); renderAuth('login'); return; }
    S.me=await api.me();
    if(!S.me || ['pending','disabled'].includes(S.me.role)){ if(!S.dealers.length) S.dealers=await api.dealers().catch(()=>[]); renderPending(); return; }
    await loadAll(); renderApp();
    if(!S.ready){ S.ready=true; api.subscribe(()=>{ if(!S.edit) reload(); }); }
  }catch(e){ app.innerHTML=`<div class="auth"><div class="authbox"><b>${L('เชื่อมต่อไม่ได้','Cannot connect')}</b><div class="msg err">${esc(errMsg(e))}</div><button class="btn wide" onclick="location.reload()">${L('ลองใหม่','Retry')}</button></div></div>`; }
  finally{ booting=false; }
}
if(!DEMO){
  api.sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){ S.recovery=true; renderAuth('newpw'); return; }
    if(ev==='SIGNED_OUT'){ S.me=null; boot(); }
    else if(ev==='SIGNED_IN' && !(S.me && session && S.me.user_id===session.user.id)) setTimeout(boot,0);
  });
}

function viewStats(){

  else if(f==='closed90') list=list.filter(c=>c._t.done && dd(c.delivered_date,T)<=90);

  const tot=own.P+own.G||1, avg=k=>(own[k]/n).toFixed(1), pct=(x,t)=>t?Math.round(x/t*100):0;
  const stg={};
  list.forEach(c=>c._t.segs.forEach(s=>{ const e=stg[s.k]=stg[s.k]||{k:s.k,o:s.o,days:0,cases:new Set()}; e.days+=s.days; e.cases.add(c.id); }));

  const B=[['0–7',0,7],['8–15',8,15],['16–30',16,30],['31–60',31,60],['60+',61,1e9]].map(b=>({l:b[0]+' '+L('วัน','days'),v:list.filter(c=>c._t.total>=b[1]&&c._t.total<=b[2]).length}));
  const bmax=Math.max(...B.map(b=>b.v),1);
  const dg={}; list.forEach(c=>{ const e=dg[c.dealer_id]=dg[c.dealer_id]||{id:c.dealer_id,n:0,tot:0,P:0,G:0,rep:0,max:null}; e.n++; e.tot+=c._t.total; e.P+=c._t.own.P; e.G+=c._t.own.G; if(c._t.round>1) e.rep++; if(!e.max||c._t.total>e.max._t.total) e.max=c; });

const newStep = (kind,round,x) => Object.assign({id:'new'+Math.random().toString(36).slice(2),kind,round},x||{});
const curRound = () => Math.max(1,...S.edit.steps.map(s=>s.round||1));
function ensureRoundSteps(){ // ทุกรอบมีช่อง "ประกอบ" และ "ทดสอบ"
  for(let r=1;r<=curRound();r++) ['assemble','test'].forEach(k=>{ if(!S.edit.steps.some(s=>s.kind===k&&s.round===r)) S.edit.steps.push(newStep(k,r)); });
}
function openCase(id, dropCol){
  const base = id ? S.cases.find(x=>x.id===id) : {dealer_id: S.me.role==='ps'?S.me.dealer_id:(S.f.dealer||''), arrival_date:today(), parked:true, loaner:false, cost_band:'le10k'};
  const c={}; Object.keys(base).forEach(k=>{ if(!k.startsWith('_')) c[k]=base[k]; });
  const steps=(id?(S.stepsBy[id]||[]):[]).map(s=>({...s}));
  S.edit={c,steps,removed:[],id,logs:[],orig:id?normCase(c):null,origSteps:Object.fromEntries(normSteps(steps).map(s=>[s.id,s]))};
  ensureRoundSteps();
  if(dropCol){
    if(c.delivered_date && dropCol!=='done') c.delivered_date=null;   // ลากออกจาก "ส่งมอบแล้ว" = ยกเลิกวันส่งมอบ
    const T=today(), r=curRound(), st=k=>S.edit.steps.find(s=>s.kind===k&&s.round===r), ss=S.edit.steps;
    const closeReplied=()=>ss.filter(s=>s.kind==='js'&&s.d2&&!s.d3).forEach(s=>s.d3=T);
    switch(dropCol){
      case 'js_wait': ss.push(newStep('js',r,{d1:T})); break;
      case 'js_close': { const w=ss.filter(s=>s.kind==='js'&&s.d1&&!s.d2&&!s.d3); w.forEach(s=>s.d2=T); break; }
      case 'ys_open': if(!c.analysis_date) c.analysis_date=T; closeReplied(); c.cost_band='gt10k'; break;
      case 'ys_wait': ss.push(newStep('ys',r,{d1:T})); c.cost_band='gt10k'; break;
      case 'parts_order': if(!c.analysis_date) c.analysis_date=T; closeReplied();
        ss.filter(s=>s.kind==='ys'&&s.d1&&!s.result).forEach(s=>{ s.result='approved'; s.d2=T; }); break;
      case 'eta': ss.push(newStep('parts',r,{d1:T})); break;
      case 'test': { const op=ss.filter(s=>s.kind==='parts'&&s.d1&&!s.d3); if(op.length) op.forEach(s=>s.d3=T); else st('assemble').d1=T; break; }
      case 'follow': { const a=st('assemble'); if(!a.d1) a.d1=T; const x=st('test'); x.d1=T; x.result='pass'; break; }
      case 'done': c.delivered_date=T; break;
    }
    S.edit.hint=L('ใส่วันที่วันนี้ให้แล้ว — กรอกเลขอ้างอิงให้ครบ แล้วกด "บันทึก"','Today\'s date has been filled in — complete the reference numbers, then press "Save"');
  }
  renderModal();
  if(id){ const E=S.edit; api.logs(id).then(l=>{ if(S.edit===E){ E.logs=l||[]; renderStamps(); } }).catch(()=>{}); }
}

  return '';

function normCase(src){
  const c={}; CASE_FIELDS.forEach(k=>{ if(src[k]!==undefined) c[k]=src[k]; });
  ['sp','vin','model','remark','symptom','cause'].forEach(k=>{ if(typeof c[k]==='string') c[k]=c[k].trim(); });
  if(c.vin) c.vin=c.vin.toUpperCase(); if(c.sp) c.sp=c.sp.toUpperCase();
  Object.keys(c).forEach(k=>{ if(c[k]==='') c[k]=null; });
  c.parked = !(c.parked===false || c.parked==='0');
  c.loaner = c.loaner===true || c.loaner==='1';
  if(c.dealer_id!=null && !isNaN(+c.dealer_id)) c.dealer_id=+c.dealer_id;
  if(!c.id) delete c.id;
  return c;
}
function withPrefix(ref,p){ if(!ref) return null; ref=ref.trim().toUpperCase().replace(/\s+/g,''); if(!ref) return null;
  const re=new RegExp('^'+p.replace('-','')+'-?','i'); return re.test(ref) ? p+ref.replace(re,'') : p+ref; }
function normSteps(steps){
  return steps.map(s=>{ const o={}; STEP_FIELDS.forEach(k=>o[k]= s[k]===''?null:(s[k]??null));
    if(o.kind==='js') o.ref_no=withPrefix(o.ref_no,'JS-');
    if(o.kind==='ys') o.ref_no=withPrefix(o.ref_no,'YS-');
    if(o.kind==='parts' && o.parts_type) o.ref_no=withPrefix(o.ref_no,o.parts_type+'-');
    if(o.kind==='test' && o.d1 && !o.result) o.result='testing';   // ใส่วันทดสอบแต่ยังไม่เลือกผล = อยู่ระหว่างทดสอบ
    return o; })
  .filter(s=> s.kind==='js'||s.kind==='ys'||s.kind==='parts' ? (s.ref_no||s.d1||s.d2||s.d3||s.result) : (s.d1||s.result));
}

function validate(c,ss){   // ห้ามบันทึกเฉพาะ 3 ช่องหลัก + ส่งมอบทั้งที่ทดสอบไม่ผ่าน (นอกนั้นเป็นแค่ "ยังขาด")
  if(!c.dealer_id) return L('กรุณาเลือกศูนย์บริการ','Please select a dealer');
  if(!c.sp) return L('กรุณากรอก SP','Please enter the SP');
  if(!c.arrival_date) return L('กรุณากรอกวันที่รถมาถึง','Please enter the arrival date');
  if(c.delivered_date){
    const R=Math.max(1,...ss.map(s=>s.round||1)), lt=ss.find(s=>s.kind==='test'&&s.round===R);
    if(lt&&lt.result==='fail') return L('รอบล่าสุดทดสอบไม่ผ่าน — ยังส่งมอบไม่ได้ (กด ✕ ที่ช่องส่งมอบเพื่อล้างวันที่)','Latest test failed — cannot deliver yet (press ✕ on the delivery date to clear it)');
  }
  return null;
}
function todoList(c,ss){   // ข้อมูลที่ยังขาด: บันทึกได้ แต่ขึ้นป้ายให้กลับมาเติม
  const t=[], A=c.arrival_date, bad=d=>d&&A&&d<A, add=x=>{ if(!t.includes(x)) t.push(x); };
  if(bad(c.analysis_date)||bad(c.customer_contact_date)||bad(c.delivered_date)) add(L('วันที่ก่อนวันรถมาถึง','date before arrival'));
  (ss||[]).forEach(s=>{
    if(s.kind==='js'){ if(!s.ref_no) add(L('ยังไม่มีเลข JS','no JS no.')); if(!s.d1) add(L('JS ยังไม่มีวันที่ขอ','JS has no request date'));
      if(bad(s.d1)||(s.d1&&s.d2&&s.d2<s.d1)||(s.d1&&s.d3&&s.d3<s.d1)) add(L('วันที่ JS ไม่เรียงกัน','JS dates out of order')); }
    if(s.kind==='ys'){ if(!s.ref_no) add(L('ยังไม่มีเลข YS','no YS no.')); if(!s.d1) add(L('YS ยังไม่มีวันที่ขอ','YS has no request date'));
      if(s.result&&!s.d2) add(L('YS ยังไม่มีวันที่ตอบ','YS has no reply date')); if(s.d2&&!s.result) add(L('YS ยังไม่เลือกผล','YS result not chosen'));
      if(bad(s.d1)||(s.d1&&s.d2&&s.d2<s.d1)) add(L('วันที่ YS ไม่เรียงกัน','YS dates out of order')); }
    if(s.kind==='parts'){ if(!s.parts_type) add(L('ยังไม่เลือก PO/BO','PO/BO not chosen')); if(!s.ref_no) add(L('ยังไม่มีเลข PO/BO','no PO/BO no.'));
      if(!s.d1) add(L('อะไหล่ยังไม่มีวันที่สั่ง','parts have no order date')); if(s.d1&&!s.d2&&!s.d3) add(L('ยังไม่มี ETA','no ETA yet'));
      if(bad(s.d1)||(s.d1&&s.d3&&s.d3<s.d1)) add(L('วันที่อะไหล่ไม่เรียงกัน','parts dates out of order')); }
    if(s.kind==='test'){ if(s.result&&s.result!=='testing'&&!s.d1) add(L('ยังไม่มีวันที่ทดสอบ','no test date')); if(s.result==='other'&&!s.note) add(L('ผลทดสอบ "อื่นๆ" ยังไม่ระบุ','"Other" test result not specified')); }
    if((s.kind==='assemble'||s.kind==='test')&&bad(s.d1)) add(L('วันซ่อมก่อนวันรถมาถึง','repair date before arrival'));
  });
  if(c.delivered_date){
    if((ss||[]).some(s=>s.kind==='js'&&s.d1&&!s.d3)) add(L('ส่งมอบแล้วแต่ JS ยังไม่ปิด','delivered but JS still open'));
    if((ss||[]).some(s=>s.kind==='parts'&&s.d1&&!s.d3)) add(L('ส่งมอบแล้วแต่อะไหล่ยังไม่ลงวันมาถึง','delivered but parts arrival not set'));
  }
  return t;
}
let saving=false;
async function saveCase(){
  if(saving) return; readForm();
  const E=S.edit, c=normCase(E.c), ss=normSteps(E.steps);
  const err=validate(c,ss); if(err) return toast(err);
  // ส่งเฉพาะช่องที่เปลี่ยน (ตำแหน่งที่สิทธิ์จำกัดจะไม่ชนช่องที่ไม่ใช่ของตัวเอง)
  let payload=c;
  if(E.id){ payload={id:E.id}; Object.keys(c).forEach(k=>{ if(k!=='id' && JSON.stringify(c[k]??null)!==JSON.stringify(E.orig[k]??null)) payload[k]=c[k]; }); }
  const changed=ss.filter(s=>{ const o=E.origSteps[s.id]; return !o || STEP_FIELDS.some(k=>JSON.stringify(s[k]??null)!==JSON.stringify(o[k]??null)); });
  const keep=new Set(ss.map(s=>s.id));
  const removed=[...new Set([...E.removed, ...Object.keys(E.origSteps).filter(id=>!keep.has(id))])];
  if(E.id && Object.keys(payload).length===1 && !changed.length && !removed.length){ closeModal(); return; }
  saving=true;
  const td=todoList(c,ss);
  try{ const saved=await api.saveCase(payload); await api.syncSteps(saved.id||E.id, changed, removed); closeModal(); await reload();
    toast(td.length?L('บันทึกแล้ว · ยังขาด '+td.length+' รายการ (ขึ้นที่การ์ด)','Saved · '+td.length+' item(s) still missing (shown on the card)'):L('บันทึกแล้ว','Saved')); }
  catch(e){ toast(errMsg(e)); } finally{ saving=false; }
}

    case 'svmaddallowed': { const g=k=>$(`[data-tal="${k}"]`).value.trim(); const email=g('email').toLowerCase();
      if(!/^\S+@\S+\.\S+$/.test(email)) return toast(L('อีเมลไม่ถูกต้อง','Invalid email'));
      try{ await api.saveAllowed([{email,full_name:g('full_name')||null,role:'ps',category:g('category'),dealer_id:S.me.dealer_id}]); await reload(); toast(L('เพิ่มแล้ว','Added')); }catch(err){ toast(errMsg(err)); } break; }
    case 'svmbulkallowed': { const bad=[], rows=$('#bulkTeam').value.split(/\r?\n/).map(l=>l.split(/\t|,/).map(x=>x.trim())).filter(r=>r[0]).map(r=>{
        const cat=parseCat(r[2]); if(!/@/.test(r[0])||!cat||cat==='rsm'){ bad.push(r[0]); return null; }
        return {email:r[0].toLowerCase(),full_name:r[1]||null,role:'ps',category:cat,dealer_id:S.me.dealer_id}; }).filter(Boolean);
      if(!rows.length) return toast(L('ไม่พบข้อมูลที่ใช้ได้','No valid rows')+(bad.length?': '+bad.join(', '):''));
      try{ await api.saveAllowed(rows); await reload(); toast(L('นำเข้า','Imported')+' '+rows.length+(bad.length?' · '+L('ข้าม','skipped')+': '+bad.join(', '):'')); }catch(err){ toast(errMsg(err)); } break; }
    case 'addallowed': { const g=k=>$(`[data-al="${k}"]`).value.trim(); const email=g('email').toLowerCase();
      if(!/^\S+@\S+\.\S+$/.test(email)) return toast(L('อีเมลไม่ถูกต้อง','Invalid email'));
      const row={email,full_name:g('full_name')||null,role:g('role'),category:g('category')||null,dealer_id:g('dealer_id')?+g('dealer_id'):null};
      if(row.role==='ps'&&(!row.dealer_id||!row.category)) return toast(L('PS ต้องเลือกตำแหน่งและศูนย์','PS needs a position and dealer'));
      try{ await api.saveAllowed([row]); await reload(); toast(L('เพิ่มแล้ว','Added')); }catch(err){ toast(errMsg(err)); } break; }
    case 'bulkallowed': { const bad=[], rows=$('#bulkAl').value.split(/\r?\n/).map(l=>l.split(/\t|,/).map(x=>x.trim())).filter(r=>r[0]).map(r=>{
        const cat=parseCat(r[2]), dl=findDealer(r[3]); const role=cat==='rsm'?'rsm':'ps';
        if(!/@/.test(r[0])||(role==='ps'&&(!cat||!dl))){ bad.push(r[0]); return null; }
        return {email:r[0].toLowerCase(),full_name:r[1]||null,role,category:role==='ps'?cat:null,dealer_id:role==='ps'?dl:null}; }).filter(Boolean);
      if(!rows.length) return toast(L('ไม่พบข้อมูลที่ใช้ได้','No valid rows')+(bad.length?': '+bad.join(', '):''));
      try{ await api.saveAllowed(rows); await reload(); toast(L('นำเข้า','Imported')+' '+rows.length+(bad.length?' · '+L('ข้าม','skipped')+': '+bad.join(', '):'')); }catch(err){ toast(errMsg(err)); } break; }
    case 'recheck': boot(); break;
    case 'bulk': { const rows=$('#bulk').value.split(/\r?\n/).map(l=>l.split(/\t|,/).map(s=>s.trim())).filter(r=>r[1]).map(r=>({code:r[0]||null,name:r[1],zone:r[2]||null,rsm:r[3]||null,active:true}));
      if(!rows.length) return toast(L('ไม่พบข้อมูล','Nothing to import')); try{ await api.bulkDealers(rows); await reload(); toast(L('นำเข้า','Imported')+' '+rows.length); }catch(err){ toast(errMsg(err)); } break; }
  }
});
let delArm=0;
function confirmDel(){ // กดลบ 2 ครั้งภายใน 3 วินาที (ไม่ใช้ popup ของเบราว์เซอร์)
  if(Date.now()-delArm<3000){ delArm=0; return true; }
  delArm=Date.now(); toast(L('กด "ลบ" อีกครั้งเพื่อยืนยัน','Press "Delete" again to confirm')); return false;
}
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.closest('#modal')){ if(!S.edit) return; // ช่องที่เปลี่ยนหน้าตาฟอร์ม → วาดใหม่, ที่เหลือแค่อัปเดตตัวอย่างสถานะ
    if(el.dataset.c==='cost_band' || el.dataset.sf==='result' || el.dataset.sf==='parts_type'){ readForm(); renderModal(); } else updatePreview(); return; }
  if(el.id==='suCat'){ $('#suDealer').classList.toggle('hidden', el.value==='rsm'); return; }
  if(el.dataset.demoSel!==undefined){ S.me={...DEMO_USERS[el.value]}; S.f={rsm:'',dealer:'',q:'',parked:'',loaner:'',showDone:false,period:'open'}; S.tab='board'; loadAll().then(renderApp); return; }
  const k=el.dataset.f; if(!k || k==='q') return;
  S.f[k]= el.type==='checkbox'?el.checked:el.value;
  if(k==='rsm') S.f.dealer='';
  renderMain();
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.closest('#modal')){ if(!S.edit) return; if(el.type==='date'){ const st=el.dataset.s!=null&&S.edit.steps[+el.dataset.s];
      if(st&&st.kind==='test'&&el.value&&!st.result){ const r=$(`#modal input[name="tr_${el.dataset.s}"][value="testing"]`); if(r) r.checked=true; } const c=el.parentElement.querySelector('.clr'); if(c) c.classList.toggle('hidden',!el.value); updatePreview(); } return; }
  if(el.dataset.f==='q'){ S.f.q=el.value; renderView(); }
});
document.addEventListener('submit', async e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), btn=f.querySelector('button.pri'); btn.disabled=true;
  try{
    if(f.id==='fLogin'){ await api.signIn(fd.get('email').trim(), fd.get('pw')); setTimeout(boot,0); }
    if(f.id==='fForgot'){ try{ await api.resetPw(fd.get('email').trim()); renderAuth('login',L('ส่งลิงก์ตั้งรหัสใหม่ไปที่อีเมลแล้ว (เช็กใน Junk ด้วย)','Reset link sent — check your inbox (and junk)')); }
      catch(err){ renderAuth('forgot',L('ส่งอีเมลไม่ได้ — ติดต่อ RSM เพื่อขอรหัสชั่วคราว','Could not send email — ask your RSM for a temporary password'),true); } return; }
    if(f.id==='fContact'){ await api.updateMyContact(fd.get('line').trim(), fd.get('phone').trim()); S.me.line_id=fd.get('line').trim()||null; S.me.phone=fd.get('phone').trim()||null; toast(L('บันทึกแล้ว','Saved')); try{ S.contacts=await api.contacts(); }catch(_){} $('#modal').classList.add('hidden'); renderMain(); return; }
    if(f.id==='fChPw'){ if(fd.get('pw')!==fd.get('pw2')){ toast(L('รหัสทั้งสองช่องไม่ตรงกัน','The two passwords do not match')); return; }
      if(!DEMO) await api.updatePw(fd.get('pw')); $('#modal').classList.add('hidden'); $('#modal').innerHTML=''; toast(L('เปลี่ยนรหัสผ่านแล้ว','Password changed')); return; }
    if(f.id==='fNewPw'){ await api.updatePw(fd.get('pw')); S.recovery=false; toast(L('ตั้งรหัสใหม่แล้ว','Password updated')); history.replaceState(null,'',location.pathname); boot(); return; }
    if(f.id==='fSignup'){
      const cat=fd.get('cat'), role=cat==='rsm'?'rsm':'ps';
      if(cat==='owner_svm' && (!(fd.get('line')||'').trim() || !(fd.get('phone')||'').trim())){ renderAuth('signup', L('Owner / SVM ต้องใส่ LINE ID และเบอร์โทร','Owner / SVM must enter a LINE ID and phone'), true); return; }
      const r=await api.signUp(fd.get('email').trim(), fd.get('pw'), {full_name:fd.get('name').trim(), category: role==='ps'?cat:'', requested_role:role, dealer_id: role==='ps'?fd.get('dealer'):'', line_id:(fd.get('line')||'').trim(), phone:(fd.get('phone')||'').trim()});
      if(!r.session) renderAuth('login',L('สมัครเรียบร้อย กรุณายืนยันอีเมล (ถ้ามี) แล้วรอ RSM อนุมัติ','Signed up. Confirm your email (if asked), then wait for RSM approval.'));
    }
  }catch(err){ if(f.id==='fChPw'||f.id==='fContact'){ toast(errMsg(err)); } else renderAuth(f.id==='fLogin'?'login':f.id==='fNewPw'?'newpw':'signup', errMsg(err), true); }
  finally{ btn.disabled=false; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.edit) closeModal(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && S.me && !S.edit && !DEMO && $('#main')) reload(); });

boot();

</script>
